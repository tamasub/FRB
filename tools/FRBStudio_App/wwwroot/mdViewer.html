<!DOCTYPE html>
<html lang="ja" data-theme="qiita">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRB Studio - Markdown Viewer & Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <style>
    /* --- 極上の3大テーマ定義 --- */
    :root, [data-theme="qiita"] {
      --brand-color: #55c500; /* Qiitaグリーン */
      --brand-gradient: linear-gradient(135deg, #55c500, #46a300);
      --bg: #f4f9f4; /* Qiita緑を上品に溶かし込んだライトグリーン */
      --bg2: #e8f5e8;
      --panel: rgba(255, 255, 255, 0.94);
      --text: #1f2937;
      --muted: #4b5563;
      --line: rgba(85, 197, 0, 0.22);
      --shadow: 0 20px 60px rgba(44, 77, 44, 0.08);
      --radius: 22px;
      --code-bg: #0f172a;
      --code-text: #dbeafe;
    }

    [data-theme="zenn"] {
      --brand-color: #3ea8ff; /* Zennブルー */
      --brand-gradient: linear-gradient(135deg, #3ea8ff, #2c8ee0);
      --bg: #f3f7fa; /* Zennの爽やかな薄青ベース */
      --bg2: #e9f2f7;
      --panel: rgba(255, 255, 255, 0.94);
      --text: #2d3748;
      --muted: #718096;
      --line: rgba(62, 168, 255, 0.22);
      --shadow: 0 20px 60px rgba(33, 52, 77, 0.08);
    }

    [data-theme="dark"] {
      --brand-color: #00f0ff; /* サイバーブルー */
      --brand-gradient: linear-gradient(135deg, #00f0ff, #00b0ff);
      --bg: #0b1020;
      --bg2: #111a33;
      --panel: rgba(17, 24, 39, 0.82);
      --text: #eaf0ff;
      --muted: #9aa7bd;
      --line: rgba(226, 232, 240, 0.12);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      --code-bg: #020617;
      --code-text: #dbeafe;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg), var(--bg2));
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.82;
      min-height: 100vh;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .app { width: min(1400px, calc(100% - 28px)); margin: 16px auto 56px; }
    
    /* ヘッダー・トップバー */
    .topbar {
      position: sticky;
      top: 12px;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(250px, auto) minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width:0; flex-wrap: wrap; }
    .logo { width: 42px; height: 42px; display: grid; place-items: center; flex:0 0 42px; border-radius: 16px; background: linear-gradient(135deg, rgba(63,124,255,.18), rgba(140,111,247,.18)); font-size: 22px; }
    .brand-text { min-width:0; display:grid; gap:2px; }
    .brand-title { display:flex; align-items:baseline; gap:8px; min-width:0; white-space:nowrap; }
    .brand-title strong { font-size: 18px; font-weight: 900; letter-spacing:-.02em; overflow:hidden; text-overflow:ellipsis; }
    .brand-sub { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing:.06em; text-transform: uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .badge { color: var(--muted); font-size: 11px; font-weight: 900; }
    .studio-link {
      display:inline-flex; align-items:center; gap:8px;
      padding:9px 12px; border-radius:14px;
      color:var(--text); text-decoration:none; font-size:12px; font-weight:900;
      background:rgba(105,120,160,.10); border:1px solid var(--line);
      box-shadow:none; white-space:nowrap; transition: transform .2s, background .2s, box-shadow .2s;
    }
    .studio-link:hover { transform:translateY(-1px); background:rgba(105,120,160,.18); box-shadow:0 8px 20px rgba(63,124,255,.10); }
    .controls { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; min-width:0; }
    .control-group { display:flex; align-items:center; gap:8px; min-width:0; }
    .control-group.primary-flow { flex: 1 1 450px; justify-content:flex-end; }
    .control-group.view-flow { flex: 0 1 auto; }
    .module-nav-frame {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.62);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.72),
        0 8px 22px rgba(44,77,44,.06);
      min-width: 0;
      white-space: nowrap;
    }
    [data-theme="dark"] .module-nav-frame { background: rgba(15,23,42,.40); }
    .module-nav-frame .control-group { gap: 8px; }



    .control-group.import-flow { flex: 0 1 auto; }
    .urlbox { display: flex; align-items: center; width: clamp(160px, 18vw, 260px); min-width:0; }
    #managedMdSelect { width: clamp(220px, 28vw, 380px) !important; min-width: 180px; }
    #themeSelect { width: 170px; }
    .compact-icon-btn { min-width:42px; padding:10px 12px; }
    .compact-text-btn { padding:10px 14px; }
    @media (max-width: 980px) {
      .topbar { grid-template-columns: 1fr; }
      .controls { justify-content:flex-start; }
      .control-group.primary-flow { justify-content:flex-start; flex-basis:100%; }
      #managedMdSelect { width: min(100%, 420px) !important; }
    }
    
    input, select {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.76);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    [data-theme="dark"] input, [data-theme="dark"] select { background: rgba(30,41,59,0.7); }
    input:focus, select:focus { border-color: var(--brand-color); }
    
    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 14px;
      background: var(--brand-gradient);
      color: white;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(63,124,255,.12);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(63,124,255,.2); }
    button:active { transform: translateY(1px); }
    .ghost-btn { background: rgba(105,120,160,.12); color: var(--text); box-shadow: none; }
    .ghost-btn:hover { background: rgba(105,120,160,.2); }
    .mode-active { background: var(--text) !important; color: var(--bg) !important; box-shadow: none; }

    /* レイアウト切り替え */
    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 24px;
      margin-top: 22px;
      align-items: start;
      min-width: 0;
    }
    .layout > * { min-width: 0; }
    
    body[data-mode="editor"] .layout { grid-template-columns: 320px minmax(0, 1fr) !important; }

    body[data-mode="editor"] .sidebar { display: grid; }
    body[data-mode="viewer"] .edit-container,
    body[data-mode="editor"] .edit-container { display: none; }

    .sidebar { position: sticky; top: 108px; display: grid; gap: 16px; }
    .side-card, .article-card, .edit-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); backdrop-filter: blur(18px); box-shadow: var(--shadow); min-width: 0; }
    .side-card { padding: 20px; }
    .side-card h2 { margin: 0 0 14px; font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    
    /* 目次 */
    .toc { display: grid; gap: 2px; max-height: 40vh; overflow: auto; padding-right: 4px; }
    .toc a { display: block; padding: 8px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 13.5px; line-height: 1.45; transition: all 0.2s; }
    .toc a:hover { background: rgba(63,124,255,.08); color: var(--brand-color); padding-left: 16px; }
    .toc .level-2 { padding-left: 20px; font-size: 13px; }
    .toc .level-3 { padding-left: 32px; font-size: 12px; }
    .toc-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
    .toc-depth-btn { padding: 6px 4px; border-radius: 10px; background: rgba(105,120,160,.1); color: var(--muted); font-size: 11px; font-weight: 800; border:0; cursor:pointer;}
    .toc-depth-btn.active { background: var(--brand-gradient); color: #fff; }

    .meta-list { display: grid; gap: 12px; color: var(--muted); font-size: 13px; }
    .meta-list b { display: block; color: var(--text); margin-bottom: 2px; }

    /* エディターコックピット */
    .edit-card { height: calc(100vh - 130px); position: sticky; top: 108px; display: flex; flex-direction: column; padding: 20px; gap: 14px; }
    #editor {
      width: 100%;
      flex: 1;
      background: transparent;
      color: var(--text);
      border: none;
      resize: none;
      font-family: "Fira Code", Consolas, Monaco, "Noto Sans JP", monospace;
      font-size: 15px;
      line-height: 1.65;
      outline: none;
    }
    .edit-tools { display: flex; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; align-items: center; }

    /* mdViewer v0.11.7: Editorモードの位置復元 + Markdown汚し方式FRBコメント */
    .editor-inline-host { display: none; min-width: 0; }
    body.md-inline-editing #preview { display: none; }
    body.md-inline-editing #editorInlineHost { display: block; }
    .editor-inline-host #editor {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: calc(100vh - 220px);
      min-height: 58vh;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.74);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
      overflow: auto;
    }
    [data-theme="dark"] .editor-inline-host #editor {
      background: rgba(15,23,42,0.72);
    }
    body[data-mode="editor"] #preview [data-md-line] {
      cursor: text;
      border-radius: 10px;
      transition: background .15s ease, outline-color .15s ease, box-shadow .15s ease;
    }
    body[data-mode="editor"] #preview [data-md-line]:hover {
      background: rgba(63,124,255,.028);
    }
    #preview .md-current-block {
      outline: 1.5px dashed rgba(63,124,255,.58);
      outline-offset: 5px;
      background: rgba(63,124,255,.045);
      box-shadow: 0 0 0 3px rgba(63,124,255,.022);
    }
    #preview [data-md-block-id] {
      position: relative;
    }
    body[data-mode="editor"] #preview [data-md-block-id]::after {
      content: attr(data-md-block-type) " / " attr(data-md-block-id);
      display: none;
      position: absolute;
      right: 4px;
      top: -18px;
      padding: 2px 6px;
      border: 1px solid rgba(63,124,255,.22);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
      pointer-events: none;
      box-shadow: 0 6px 16px rgba(15,23,42,.10);
    }
    body[data-mode="editor"] #preview [data-md-block-id]:hover::after,
    body[data-mode="editor"] #preview .md-current-block[data-md-block-id]::after {
      display: inline-block;
    }
    #blockModelMeta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      word-break: break-word;
    }
    #preview .md-block-highlight {
      background: rgba(250, 204, 21, 0.34) !important;
      box-shadow: inset 0 0 0 9999px rgba(250, 204, 21, 0.10), 0 0 0 3px rgba(250, 204, 21, 0.12);
      border-radius: 10px;
    }
    #preview .md-block-highlight.md-current-block,
    body[data-mode="editor"] #preview .md-block-highlight:hover {
      outline: 1.5px dashed rgba(202, 138, 4, 0.62);
      outline-offset: 5px;
      background: rgba(250, 204, 21, 0.40) !important;
    }
    .md-block-action-menu {
      position: fixed;
      z-index: 260;
      min-width: 172px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(15,23,42,.20);
      display: none;
    }
    .md-block-action-menu.show { display: grid; gap: 6px; }
    .md-block-action-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 9px 10px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: none;
    }
    .md-block-action-menu button:hover {
      background: rgba(250, 204, 21, 0.18);
      transform: none;
    }
    .md-block-action-menu button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .md-block-action-menu button:disabled:hover {
      background: transparent;
    }
    .md-block-action-menu .menu-note {
      padding: 2px 10px 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }
    .md-block-action-menu .menu-separator {
      height: 1px;
      margin: 3px 4px;
      background: var(--line);
    }
    .md-block-inline-actions {
      position: fixed;
      z-index: 240;
      pointer-events: auto;
      display: none;
      gap: 6px;
      padding: 6px;
      border: 1px solid rgba(63,124,255,.20);
      border-radius: 999px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 14px 36px rgba(15,23,42,.18);
      transform: translateY(-50%);
    }
    .md-block-inline-actions.show { display: flex; align-items: center; }
    .md-block-inline-actions button {
      min-width: 34px;
      height: 30px;
      padding: 0 10px;
      border: 0;
      border-radius: 999px;
      background: rgba(63,124,255,.10);
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
      line-height: 30px;
      cursor: pointer;
      box-shadow: none;
    }
    .md-block-inline-actions button:hover {
      transform: none;
      background: rgba(85,197,0,.16);
    }
    .md-block-inline-actions button[data-action="deleteBlock"] {
      background: rgba(239,68,68,.10);
    }
    .md-block-inline-actions button[data-action="deleteBlock"]:hover {
      background: rgba(239,68,68,.18);
    }
    body:not([data-mode="editor"]) .md-block-inline-actions,
    body.md-inline-editing .md-block-inline-actions {
      display: none !important;
    }
    body.md-block-inline-actions-visible #preview .md-current-block[data-md-block-id]::after {
      display: none !important;
    }

    /* mdViewer v0.13.2: Markdown TableCell editor */
    body[data-mode="editor"] #preview th[data-md-cell-id],
    body[data-mode="editor"] #preview td[data-md-cell-id] {
      position: relative;
      cursor: cell;
      transition: background .14s ease, box-shadow .14s ease, outline-color .14s ease;
    }
    body[data-mode="editor"] #preview th[data-md-cell-id]:hover,
    body[data-mode="editor"] #preview td[data-md-cell-id]:hover {
      background: rgba(85,197,0,.10) !important;
      box-shadow: inset 0 0 0 2px rgba(85,197,0,.30);
    }
    #preview th.md-current-table-cell,
    #preview td.md-current-table-cell {
      background: rgba(85,197,0,.14) !important;
      box-shadow: inset 0 0 0 2px rgba(85,197,0,.52), 0 0 0 3px rgba(85,197,0,.08);
    }
    .md-table-cell-editor {
      position: fixed;
      z-index: 300;
      width: min(420px, calc(100vw - 24px));
      padding: 12px;
      border: 1px solid rgba(85,197,0,.24);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      box-shadow: 0 22px 58px rgba(15,23,42,.24);
      display: none;
      gap: 10px;
    }
    .md-table-cell-editor.show { display: grid; }
    .md-table-cell-editor-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 900;
      color: var(--text);
    }
    .md-table-cell-editor-title span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .md-table-cell-editor textarea {
      width: 100%;
      min-height: 96px;
      resize: vertical;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.72);
      color: var(--text);
      font: 13.5px/1.55 "Fira Code", Consolas, Monaco, "Noto Sans JP", monospace;
      outline: none;
    }
    [data-theme="dark"] .md-table-cell-editor textarea {
      background: rgba(15,23,42,.72);
    }
    .md-table-cell-editor textarea:focus {
      border-color: rgba(85,197,0,.58);
      box-shadow: 0 0 0 3px rgba(85,197,0,.12);
    }
    .md-table-cell-editor-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
    }
    .md-table-cell-editor-actions button {
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      box-shadow: none;
    }
    .md-table-cell-editor-actions button[data-action="cancel"] {
      background: rgba(105,120,160,.12);
      color: var(--text);
    }
    .md-table-cell-editor-note {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }
    body.md-table-cell-editing .md-block-inline-actions {
      display: none !important;
    }

    /* mdViewer v0.13.3: Sidecar JSON comments */
    #preview .md-sidecar-comment-target {
      position: relative;
      outline: 1.5px dashed rgba(59,130,246,.32);
      outline-offset: 3px;
    }
    #preview th.md-sidecar-comment-target,
    #preview td.md-sidecar-comment-target {
      outline-offset: -3px;
      box-shadow: inset 0 0 0 2px rgba(59,130,246,.24);
    }
    #preview .md-sidecar-comment-badge {
      position: absolute;
      right: 7px;
      top: 5px;
      z-index: 18;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      border: 1px solid rgba(59,130,246,.22);
      background: rgba(255,255,255,.94);
      color: var(--text);
      font-size: 11px;
      font-weight: 950;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(15,23,42,.14);
      cursor: pointer;
      user-select: none;
    }
    [data-theme="dark"] #preview .md-sidecar-comment-badge {
      background: rgba(15,23,42,.94);
    }
    #preview .md-sidecar-comment-badge:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(15,23,42,.20);
    }
    #preview .md-sidecar-comment-badge.status-OK { border-color: rgba(34,197,94,.38); background: rgba(34,197,94,.13); }
    #preview .md-sidecar-comment-badge.status-NG { border-color: rgba(239,68,68,.42); background: rgba(239,68,68,.13); }
    #preview .md-sidecar-comment-badge.status-TODO { border-color: rgba(245,158,11,.42); background: rgba(245,158,11,.15); }
    #preview .md-sidecar-comment-badge.status-ASK { border-color: rgba(168,85,247,.38); background: rgba(168,85,247,.13); }
    #preview .frb-comment-bubble {
      position: relative;
      margin: 14px 0 18px 18px;
      padding: 14px 16px 14px 18px;
      border-left: 6px solid rgba(63,124,255,.55);
      border-radius: 16px 18px 18px 16px;
      background: rgba(63,124,255,.085);
      box-shadow: 0 10px 28px rgba(15,23,42,.08), inset 0 1px 0 rgba(255,255,255,.45);
      color: var(--text);
    }
    #preview .frb-comment-bubble::before {
      content: "";
      position: absolute;
      left: -13px;
      top: 18px;
      width: 14px;
      height: 14px;
      transform: rotate(45deg);
      background: inherit;
      border-left: 1px solid rgba(63,124,255,.18);
      border-bottom: 1px solid rgba(63,124,255,.18);
    }
    #preview .frb-comment-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .02em;
    }
    #preview .frb-comment-meta {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    #preview .frb-comment-body {
      white-space: pre-wrap;
      line-height: 1.75;
      font-size: 14px;
      font-weight: 650;
    }
    #preview .frb-comment-status-OK {
      border-left-color: rgba(34,197,94,.70);
      background: rgba(34,197,94,.10);
    }
    #preview .frb-comment-status-NG {
      border-left-color: rgba(239,68,68,.74);
      background: rgba(239,68,68,.10);
    }
    #preview .frb-comment-status-TODO {
      border-left-color: rgba(245,158,11,.78);
      background: rgba(245,158,11,.12);
    }
    #preview .frb-comment-status-ASK {
      border-left-color: rgba(168,85,247,.72);
      background: rgba(168,85,247,.10);
    }
    #preview .frb-comment-status-MEMO,
    #preview .frb-comment-status-COMMENT {
      border-left-color: rgba(59,130,246,.70);
      background: rgba(59,130,246,.10);
    }

    /* Qiita風 / コマンドメニュー */

    /* 見出し共通: v007 heading-align
       h1/h2/h3の padding-left が本文より右ズレして見える原因だったため、
       通常の見出しは本文と同じ左端に揃える。
       制約レポートだけは .constraint-report 側の専用インデントで調整する。 */
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      color: var(--text);
      line-height: 1.35;
      padding-left: 0;
      margin-left: 0;
      overflow-wrap:anywhere;
    }
    .markdown-body h1 { margin: 0 0 24px; font-size: clamp(28px, 4vw, 36px); font-weight: 800; letter-spacing: -.03em; }
    .markdown-body h2 { margin: 46px 0 20px; padding-bottom: 10px; border-bottom: 2px solid rgba(105,120,160,0.15); font-size: clamp(20px, 3vw, 26px); font-weight: 800; }
    html[data-theme="qiita"] .markdown-body h2 { border-bottom-color: rgba(85,197,0,0.3); }
    html[data-theme="zenn"] .markdown-body h2 { border-bottom-color: rgba(62,168,255,0.3); }
    .markdown-body h3 { margin: 36px 0 16px; font-size: 19px; font-weight: 800; }
    .markdown-body h4 { margin: 30px 0 12px; font-size: 16.5px; font-weight: 900; }
    .markdown-body h5 { margin: 20px 0 8px; font-size: 15px; font-weight: 900; }
    .markdown-body h6 { margin: 16px 0 6px; font-size: 14px; font-weight: 850; color: var(--muted); }
    .markdown-body h4 + p, .markdown-body h5 + p, .markdown-body h6 + p { margin-top: 6px; }

    /* Markdown階層インデント v005-safe
       通常記事にインデント補正をかけると本文が崩れるため、
       AI制約設計書レポートとして検出した時だけ .constraint-report を付けて有効化する。 */
    .markdown-body.constraint-report {
      --md-indent-h4: 8px;
      --md-indent-h5: 24px;
      --md-indent-h6: 36px;
      --md-content-indent-h4: 14px;
      --md-content-indent-h5: 34px;
      --md-content-indent-h6: 46px;
    }
    .markdown-body.constraint-report h4 {
      margin-left: var(--md-indent-h4);
      padding-left: 0;
    }
    .markdown-body.constraint-report h5 {
      margin-left: var(--md-indent-h5);
      padding-left: 0;
    }
    .markdown-body.constraint-report h6 {
      margin-left: var(--md-indent-h6);
      padding-left: 0;
    }
    .markdown-body.constraint-report .md-indent-h4-content,
    .markdown-body.constraint-report .md-indent-h5-content,
    .markdown-body.constraint-report .md-indent-h6-content {
      box-sizing: border-box;
    }
    .markdown-body.constraint-report .md-indent-h4-content { margin-left: var(--md-content-indent-h4); }
    .markdown-body.constraint-report .md-indent-h5-content { margin-left: var(--md-content-indent-h5); }
    .markdown-body.constraint-report .md-indent-h6-content { margin-left: var(--md-content-indent-h6); }

    .markdown-body.constraint-report table.md-indent-h4-content,
    .markdown-body.constraint-report pre.md-indent-h4-content,
    .markdown-body.constraint-report blockquote.md-indent-h4-content {
      width: calc(100% - var(--md-content-indent-h4));
      max-width: calc(100% - var(--md-content-indent-h4));
    }
    .markdown-body.constraint-report table.md-indent-h5-content,
    .markdown-body.constraint-report pre.md-indent-h5-content,

    }
    /* Markdown通常記事 v008-body-indent

  mirror.style.minHeight = "0";
  mirror.style.overflow = "hidden";
  props.forEach(prop => { mirror.style[prop] = cs[prop]; });
}
function measureTextareaCaretTop(charIndex) {
  const mirror = ensureTextareaMirror();
  syncTextareaMirrorStyle(mirror);
  const before = editorEl.value.slice(0, Math.max(0, charIndex));
  mirror.textContent = before;
  const marker = document.createElement("span");
  marker.textContent = "\u200b";
  mirror.appendChild(marker);
  return marker.offsetTop;
}
function centerTextareaOnCharIndex(charIndex, behavior = "auto") {
  const top = measureTextareaCaretTop(charIndex);
  const target = Math.max(0, top - editorEl.clientHeight * 0.42);
  editorEl.scrollTo({ top: target, behavior });
}
function moveCaretToLine(lineNo, behavior = "auto") {
  const line = Math.max(1, Number(lineNo || 1));
  const pos = lineToCharIndex(line);
  editorEl.focus({ preventScroll: true });
  editorEl.setSelectionRange(pos, pos);
  requestAnimationFrame(() => requestAnimationFrame(() => centerTextareaOnCharIndex(pos, behavior)));
  markdownEditorRuntime.lastActiveLine = line;
  markdownEditorRuntime.lastActiveAnchor = anchorFromLine(line);
}
function enterInlineMarkdownEdit(lineNo, anchor = null) {
  if (getMode() !== "editor" || launchMarkdownRuntime.readonly) return;

  document.body.classList.add("md-inline-editing");
  if (editorEl.parentElement !== editorInlineHost) editorInlineHost.appendChild(editorEl);
  moveCaretToLine(line, "auto");
}

// Qiita風 / コマンド入力（Code / Table）
const slashCommands = [
  {
    key: "code",
    aliases: ["code", "コード", "```"],
    icon: "</>",
    title: "Code block",
    desc: "``` で囲んだコードブロックを挿入",
    make: () => "```\n\n```"
  },
  {
    key: "table",
    aliases: ["table", "テーブル", "表"],
    icon: "▦",
    title: "Table",
    desc: "Markdownテーブルを挿入",
    make: () => "| 項目 | 内容 |\n|---|---|\n|  |  |"
  }
];
let slashState = { open: false, start: -1, query: "", active: 0 };

function getCurrentLineInfo() {
  const pos = editorEl.selectionStart;
  const value = editorEl.value;
  const lineStart = value.lastIndexOf("\n", pos - 1) + 1;
  const lineEndIdx = value.indexOf("\n", pos);
  const lineEnd = lineEndIdx === -1 ? value.length : lineEndIdx;
  return { pos, lineStart, lineEnd, line: value.slice(lineStart, lineEnd), beforeCaret: value.slice(lineStart, pos) };
}

function getSlashMatches(query) {
  const q = query.trim().toLowerCase();
  if (!q) return slashCommands;
  return slashCommands.filter(cmd => cmd.aliases.some(a => a.toLowerCase().startsWith(q)) || cmd.title.toLowerCase().includes(q));
}

function positionSlashMenu() {
  const rect = editorEl.getBoundingClientRect();
  slashMenu.style.left = Math.min(rect.left + 22, window.innerWidth - 300) + "px";
  slashMenu.style.top = Math.min(rect.top + 58, window.innerHeight - 180) + "px";
}

function showSlashMenu(query = "") {
  const matches = getSlashMatches(query);
  if (!matches.length) { hideSlashMenu(); return; }
  slashState.open = true;
  slashState.query = query;
  slashState.active = Math.min(slashState.active, matches.length - 1);
  slashMenu.innerHTML = `<div class="slash-hint">/ でMarkdown部品を挿入　↑↓ Enter / Esc</div>` + matches.map((cmd, i) => `
    <button type="button" class="slash-item ${i === slashState.active ? "active" : ""}" data-key="${cmd.key}" role="option" aria-selected="${i === slashState.active}">
      <span class="slash-icon">${cmd.icon}</span>
      <span><div class="slash-title">${cmd.title}</div><div class="slash-desc">${cmd.desc}</div></span>
    </button>
  `).join("");
  slashMenu.querySelectorAll(".slash-item").forEach(btn => {
    btn.addEventListener("mousedown", e => {
      e.preventDefault();
      applySlashCommand(btn.dataset.key);
    });
  });
  positionSlashMenu();
  slashMenu.classList.add("show");
}

function hideSlashMenu() {
  slashState.open = false;
  slashMenu.classList.remove("show");
}

function replaceRange(start, end, text, selectStartOffset = null, selectEndOffset = null) {
  const value = editorEl.value;
  editorEl.value = value.slice(0, start) + text + value.slice(end);
  const nextPos = start + text.length;
  if (selectStartOffset !== null && selectEndOffset !== null) {
    editorEl.setSelectionRange(start + selectStartOffset, start + selectEndOffset);
  } else {
    editorEl.setSelectionRange(nextPos, nextPos);
  }
  editorEl.focus();
  renderMarkdown(editorEl.value, "#", "Live Editing");
}

function insertAtCursor(text, selectStartOffset = null, selectEndOffset = null) {
  replaceRange(editorEl.selectionStart, editorEl.selectionEnd, text, selectStartOffset, selectEndOffset);
}

// Markdownショートカット（Ctrl+B / Cmd+B：選択文字を太字化）
function wrapSelection(prefix, suffix = prefix, placeholder = "text") {
  const start = editorEl.selectionStart;
  const end = editorEl.selectionEnd;
  const value = editorEl.value;
  const selected = value.slice(start, end);

  // 選択範囲が既に prefix/suffix で囲まれている場合は解除する
  const before = value.slice(Math.max(0, start - prefix.length), start);
  const after = value.slice(end, end + suffix.length);
  if (selected && before === prefix && after === suffix) {
    const newValue = value.slice(0, start - prefix.length) + selected + value.slice(end + suffix.length);
    editorEl.value = newValue;
    editorEl.setSelectionRange(start - prefix.length, end - prefix.length);
    editorEl.focus();
    renderMarkdown(editorEl.value, "#", "Live Editing");
    return;
  }

  const body = selected || placeholder;
  const wrapped = prefix + body + suffix;
  editorEl.value = value.slice(0, start) + wrapped + value.slice(end);

  if (selected) {
    editorEl.setSelectionRange(start + prefix.length, start + prefix.length + selected.length);
  } else {
    editorEl.setSelectionRange(start + prefix.length, start + prefix.length + placeholder.length);
  }

  editorEl.focus();
  renderMarkdown(editorEl.value, "#", "Live Editing");
}

function toggleBoldSelection() {
  wrapSelection("**", "**", "太字");
}


function applySlashCommand(key) {
  const cmd = slashCommands.find(c => c.key === key);
  if (!cmd) return;
  const { lineStart, lineEnd } = getCurrentLineInfo();
  const insertion = cmd.make();
  const suffix = editorEl.value.slice(lineEnd, lineEnd + 1) === "\n" ? "" : "\n";
  const prefix = lineStart > 0 && editorEl.value.slice(lineStart - 1, lineStart) !== "\n" ? "\n" : "";
  hideSlashMenu();
  replaceRange(lineStart, lineEnd, prefix + insertion + suffix);
}

function updateSlashFromInput() {
  const info = getCurrentLineInfo();
  const m = info.beforeCaret.match(/^\s*\/([\w\u3040-\u30ff\u3400-\u9fff`-]*)$/);
  if (!m) { hideSlashMenu(); return; }
  slashState.start = info.lineStart + info.beforeCaret.indexOf("/");
  showSlashMenu(m[1] || "");
}

editorEl.addEventListener("keyup", (e) => {

editorEl.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") {
    e.preventDefault();
    hideSlashMenu();
    toggleBoldSelection();
    return;
  }
  if (!slashState.open) return;
  const matches = getSlashMatches(slashState.query);
  if (e.key === "ArrowDown") {
    e.preventDefault();
    slashState.active = (slashState.active + 1) % matches.length;
    showSlashMenu(slashState.query);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    slashState.active = (slashState.active - 1 + matches.length) % matches.length;
    showSlashMenu(slashState.query);
  } else if (e.key === "Enter" || e.key === "Tab") {
    e.preventDefault();
    applySlashCommand(matches[slashState.active].key);
  } else if (e.key === "Escape") {
    e.preventDefault();
    hideSlashMenu();
  }
});

function isConstraintReportMarkdown(content) {
  const text = String(content || "");
  return (
    text.includes("## 制約グループ詳細") ||
    (text.includes("# AI制約設計書") && text.includes("#### 含まれる個別制約"))
  );
}

function normalizePseudoJapaneseLists(md) {
  const lines = String(md || "").split(/\r?\n/);
  let inFence = false;
  let inPseudoList = false;

  const normalized = lines.map(line => {
    const trimmed = line.trim();

    if (/^```/.test(trimmed) || /^~~~/.test(trimmed)) {
      inFence = !inFence;
      inPseudoList = false;
      return line;
    }
    if (inFence) return line;

    // 日本語記事でよく使う「・」「･」をMarkdownリストとして扱う。
    if (/^[ \t　]*[・･]\s*/.test(line)) {
      inPseudoList = true;
      return line.replace(/^[ \t　]*[・･]\s*/, "- ");
    }

    // 「・項目」の直後に全角スペース等で字下げされた行は、子リストとして扱う。
    if (inPseudoList && /^[ \t　]+\S/.test(line)) {
      const body = line.replace(/^[ \t　]+/, "");
      if (!/^([-*+]|\d+\.|#{1,6}\s|>|\||```|~~~)/.test(body)) {
        return "  - " + body;
      }
    }

    if (!trimmed) {
      inPseudoList = false;
      return line;
    }

    if (!/^[ \t　]/.test(line)) inPseudoList = false;
    return line;
  });

  return normalized.join("\n");
}

function applyMarkdownIndentClasses(enabled = false) {
  const indentClasses = ["md-indent-h4-content", "md-indent-h5-content", "md-indent-h6-content"];
  previewEl.classList.toggle("constraint-report", Boolean(enabled));
  previewEl.classList.toggle("normal-article", !Boolean(enabled));

  let currentHeadingLevel = 0;
  [...previewEl.children].forEach(el => {
    el.classList.remove(...indentClasses);
    const match = el.tagName.match(/^H([1-6])$/);
    if (match) {
      currentHeadingLevel = Number(match[1]);
      return;
    }

    // 通常記事ではインデント補正しない。
    // AI制約設計書レポートだけ、h4/h5/h6配下の本文・表・リストを軽く右へ寄せる。
    if (!enabled) return;

    if (currentHeadingLevel >= 6) {
      el.classList.add("md-indent-h6-content");
    } else if (currentHeadingLevel >= 5) {
      el.classList.add("md-indent-h5-content");
    } else if (currentHeadingLevel >= 4) {
      el.classList.add("md-indent-h4-content");
    }
  });
}

function isReadonlyLaunchModeValue(mode) {

function normalizeLaunchMarkdownName(raw) {
  const value = String(raw ?? '').trim();
  if (!value) return null;
  const decoded = value.replace(/\\/g, '/');
  if (decoded.includes('://') || decoded.startsWith('//')) throw new Error(`file に外部URLは指定できません: ${value}`);
  if (decoded.startsWith('/')) throw new Error(`file に絶対パスは指定できません: ${value}`);
  if (/^[a-zA-Z]:/.test(decoded)) throw new Error(`file にローカルドライブパスは指定できません: ${value}`);
  if (/[?#]/.test(decoded)) throw new Error(`file にクエリ文字列やハッシュは指定できません: ${value}`);
  if (!/\.(md|markdown|txt)$/i.test(decoded)) throw new Error(`file は .md / .markdown / .txt を指定してください: ${value}`);
  const parts = decoded.split('/');
  if (parts.some(part => !part || part === '.' || part === '..')) throw new Error(`file のパスが不正です: ${value}`);

  let rel = parts.join('/');
  if (rel.startsWith('data/markdown/')) rel = rel.slice('data/markdown/'.length);
  if (rel.startsWith('markdown/')) rel = rel.slice('markdown/'.length);
  return rel;
}

async function refreshManagedMarkdownList(selectName = "") {
  try {
    const res = await fetch("/api/markdown", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const files = await res.json();
    managedMdSelect.innerHTML = "";
    if (!files.length) {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "管理Markdownなし";
      managedMdSelect.appendChild(opt);
      return [];
    }
    files.forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      managedMdSelect.appendChild(opt);
    });
    const target = selectName || currentManagedMarkdownName || files[0];
    if (files.includes(target)) managedMdSelect.value = target;
    return files;
  } catch (err) {
    console.warn("管理Markdown一覧の取得に失敗", err);
    managedMdSelect.innerHTML = `<option value="">一覧取得失敗</option>`;
    return [];
  }
}

async function loadManagedMarkdown(name) {
  if (!name) return;
  if (isManagedMarkdownDirty && currentManagedMarkdownName && currentManagedMarkdownName !== name) {
    const ok = confirm("未保存の編集があります。保存せずに別のMarkdownを読み込みますか？");
    if (!ok) {
      managedMdSelect.value = currentManagedMarkdownName;
      return;
    }
  }

  previewEl.innerHTML = '<div class="status-shimmer">data/markdown から容赦なくMarkdown読み込み中...</div>';
  try {
    const res = await fetch(`/api/markdown/${encodeURIComponent(name)}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();
    currentManagedMarkdownName = name;
    isManagedMarkdownDirty = false;
    editorEl.value = md;
    syncFileNameUI(name);
    await loadMarkdownCommentSidecar(name);
    renderMarkdown(md, "#", "Managed Markdown");
    applyMarkdownReadonlyLaunchControls();
  } catch (err) {
    previewEl.innerHTML = `<div class="qiita-note warn">管理Markdown読み込みエラー: ${err.message}</div>`;
  }
}

async function saveManagedMarkdown(name, content, quiet = false) {
  const fileName = normalizeMarkdownFileName(name);
  const res = await fetch(`/api/markdown/${encodeURIComponent(fileName)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: fileName, content })
  });
  if (!res.ok) throw new Error(await res.text());
  currentManagedMarkdownName = fileName;
  isManagedMarkdownDirty = false;
  syncFileNameUI(fileName);
  await refreshManagedMarkdownList(fileName);
  if (mdCommentSidecarRuntime.dirty && (mdCommentSidecarRuntime.targetFile === fileName || mdCommentSidecarRuntime.targetFile === currentManagedMarkdownName)) {
    await saveMarkdownCommentSidecar({ quiet: true });
  }
  if (!quiet) alert(`保存しました: data/markdown/${fileName}`);
  return fileName;
}

async function askRegisterAsManagedMarkdown(fileName, content) {
  const safeName = normalizeMarkdownFileName(fileName || metaFileName.value || editorFileName.value);
  syncFileNameUI(safeName);
  const ok = confirm(`${safeName} を data/markdown の管理対象にしますか？\n\nOK: data/markdown に保存して管理対象にする\nキャンセル: 画面上で開くだけ`);
  if (!ok) {
    currentManagedMarkdownName = "";
    isManagedMarkdownDirty = true;
    return;
  }
  try {
    await saveManagedMarkdown(safeName, content, true);
    alert(`管理対象にしました: data/markdown/${safeName}`);
  } catch (err) {
    alert("管理対象への保存に失敗しました。\n" + err.message);
  }
}

async function loadMarkdown(rawUrl){
  if(!rawUrl.startsWith("http")) return;
  previewEl.innerHTML='<div class="status-shimmer">思考空間を同期中（Markdown読み込み中）...</div>';
  try{
    const res=await fetch(rawUrl,{cache:"no-store"});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const md=await res.text();
    resetMarkdownCommentSidecarForLocal(rawUrl.split('/').pop() || "remote.md");
    editorEl.value = md;
    renderMarkdown(md, rawUrl, "GitHub Raw");
  }catch(err){
    previewEl.innerHTML=`<div class="qiita-note alert">読み込みエラー: ${err.message}</div>`;
  }
}

function loadLocalFile(file){
  if(!file)return;
  previewEl.innerHTML='<div class="status-shimmer">ローカルの思考コアを展開中...</div>';
  const reader=new FileReader();
  reader.onload=async ()=>{
    const md=String(reader.result||"");
    currentManagedMarkdownName = "";
    isManagedMarkdownDirty = true;
    resetMarkdownCommentSidecarForLocal(file.name);
    editorEl.value = md;
    syncFileNameUI(normalizeMarkdownFileName(file.name));
    renderMarkdown(md, "#", "Local file");
    await askRegisterAsManagedMarkdown(file.name, md);
  };
  reader.readAsText(file,"UTF-8");
}

// ファイルダイアログ連動保存
document.getElementById("btnSaveFile").addEventListener("click", () => {
  const blob = new Blob([editorEl.value], { type: "text/markdown;charset=utf-8;" });
  const a = document.createElement("a");
  const saveName = metaFileName.value || "frb_expanded_thought.md";
  a.href = URL.createObjectURL(blob);
  a.download = saveName;
  a.click();
});

// 超速クリップボード流し込み
document.getElementById("btnPasteClip").addEventListener("click", async () => {
  try {
    const text = await navigator.clipboard.readText();
    resetMarkdownCommentSidecarForLocal("clipboard.md");
    editorEl.value = text;
    renderMarkdown(text, "#", "Clipboard Paste");
    const originalText = document.getElementById("btnPasteClip").textContent;
    document.getElementById("btnPasteClip").textContent = "⚡ 思考同期完了！";
    setTimeout(() => document.getElementById("btnPasteClip").textContent = originalText, 1500);
  } catch (err) {
    alert("クリップボードの読み込み権限を許可してください。");
  }
});

btnRefreshManagedMd.addEventListener("click", async () => {
  const files = await refreshManagedMarkdownList(currentManagedMarkdownName);
  if (files.length && !currentManagedMarkdownName) await loadManagedMarkdown(managedMdSelect.value);
});

managedMdSelect.addEventListener("change", () => loadManagedMarkdown(managedMdSelect.value));

btnOverwriteManagedMd.addEventListener("click", async () => {
  try {
    const saveName = normalizeMarkdownFileName(currentManagedMarkdownName || metaFileName.value || editorFileName.value);
    if (!currentManagedMarkdownName) {
      const ok = confirm(`${saveName} を data/markdown の管理対象として保存しますか？`);
      if (!ok) return;
    }
    await saveManagedMarkdown(saveName, editorEl.value);
  } catch (err) {
    alert("上書き保存に失敗しました。\n" + err.message);
  }
});

document.getElementById("loadBtn").addEventListener("click",()=>loadMarkdown(mdUrlEl.value));
localFileBtn.addEventListener("click",()=>localFileInput.click());
localFileInput.addEventListener("change",e=>loadLocalFile(e.target.files&&e.target.files[0]));

// 強固な全画面ドラッグ＆ドロップ検知
window.addEventListener("dragover", (e) => {
  e.preventDefault();
  document.body.classList.add("drag-over");
});
window.addEventListener("dragleave", (e) => {
  e.preventDefault();
  if (e.clientX === 0 && e.clientY === 0) {
    document.body.classList.remove("drag-over");
  }
});
window.addEventListener("drop", (e) => {
  e.preventDefault();
  document.body.classList.remove("drag-over");
  if (e.dataTransfer && e.dataTransfer.files.length > 0) {
    loadLocalFile(e.dataTransfer.files[0]);
  }
});

tocDepthBtns.forEach(btn=>btn.addEventListener("click",()=>{
  tocDepth=btn.dataset.depth;
  tocDepthBtns.forEach(b=>b.classList.toggle("active",b.dataset.depth===tocDepth));
  buildToc();
}));

// 初期ロード: ?file=xxx.md があればそれを優先。無ければ data/markdown の先頭を読む。
(async () => {
  const params = new URLSearchParams(location.search);
  const requestedFileRaw = params.get('file') || params.get('md');
  const mode = params.get('mode') || '';
  launchMarkdownRuntime = {
    fromUrl: Boolean(requestedFileRaw),
    readonly: isReadonlyLaunchModeValue(mode),
    fileParam: requestedFileRaw || ''
  };

  try {
    const requestedFile = requestedFileRaw ? normalizeLaunchMarkdownName(requestedFileRaw) : '';
    const files = await refreshManagedMarkdownList(requestedFile || '');
    if (requestedFile) {
      await loadManagedMarkdown(requestedFile);
    } else if (files.length) {
      await loadManagedMarkdown(managedMdSelect.value || files[0]);
    } else {
      loadMarkdown(mdUrlEl.value);
      applyMarkdownReadonlyLaunchControls();
    }
  } catch (err) {
    console.error(err);
    previewEl.innerHTML = `<div class="qiita-note warn">URL Launch 読み込みエラー: ${String(err.message || err)}</div>`;
    applyMarkdownReadonlyLaunchControls();
  }
})();
</script>
