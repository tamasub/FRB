  <style>
  /* Studio tools: Markdown出力・各Viewerへの導線 */
  .studio-tool-dock {
    display: inline-flex;
    align-items: stretch;
    gap: 8px;
    padding: 5px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 18px;
    background:
      linear-gradient(135deg, rgba(15, 23, 42, 0.28), rgba(30, 41, 59, 0.12));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    flex-wrap: wrap;
  }
  .studio-tool-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.055);
  }
  .studio-tool-label {
    align-self: stretch;
    display: inline-flex;
    align-items: center;
    padding: 0 8px;
    border-right: 1px solid rgba(255, 255, 255, 0.14);
    color: rgba(226, 232, 240, 0.72);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .studio-mini-button,
  .studio-nav-link {
    min-height: 40px;
    border-radius: 13px;
    white-space: nowrap;
    line-height: 1.05;
  }
  .studio-mini-button {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 2px;
    min-width: 74px;
    padding: 7px 11px;
    text-align: left;
  }
  .studio-mini-button .tool-main,
  .studio-nav-link .nav-main {
    display: block;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.02em;
  }
  .studio-mini-button .tool-sub,
  .studio-nav-link .nav-sub {
    display: block;
    margin-top: 1px;
    font-size: 9px;
    font-weight: 800;
    opacity: 0.70;
    letter-spacing: 0.03em;
  }
  .studio-nav-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    border: 1px solid rgba(255, 255, 255, 0.30);
    color: #ffffff;
    text-decoration: none;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.24), transparent 30%),
      linear-gradient(135deg, #334155 0%, #2563eb 100%);
    box-shadow:
      0 9px 20px rgba(15, 23, 42, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.24);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }
  .studio-nav-link:hover {
    transform: translateY(-1px);
    filter: brightness(1.06);
    box-shadow:
      0 13px 26px rgba(37, 99, 235, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.34);
  }
  .studio-nav-link:active {
    transform: translateY(1px);
  }
  .studio-nav-link .nav-icon {
    width: 24px;
    height: 24px;
    display: inline-grid;
    place-items: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.24);
    font-size: 13px;
  }
  .studio-nav-link.markdown-link {
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.25), transparent 30%),
      linear-gradient(135deg, #22c55e 0%, #14b8a6 45%, #2563eb 100%);
  }
  .studio-nav-link.diff-link {
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.24), transparent 30%),
      linear-gradient(135deg, #f97316 0%, #ef4444 48%, #7c3aed 100%);
  }
  .studio-nav-link.metadiff-link {
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.24), transparent 30%),
      linear-gradient(135deg, #8b5cf6 0%, #2563eb 50%, #0f766e 100%);
  }
  @media (max-width: 920px) {
    .studio-tool-dock,
    .studio-tool-group {
      width: 100%;
    }
    .studio-tool-group {
      flex-wrap: wrap;
    }
    .studio-tool-label {
      min-height: 34px;
    }

<body>
  <header class="app-header" id="appHeader">
    <div class="brand-block">
      <div class="app-kicker" id="appBrand">FRB Studio</div>
      <h1><span id="appProductName" class="app-product-name">JSON Object Studio</span><span id="appDisplayVersion" class="app-version">v0.4-r001</span></h1>
      <p id="appTagline">JSONで思考を構造化し、AIとの文脈を育てる。</p>
    </div>
    <section class="loader-panel" aria-label="JSON読み込み">
      <label class="combo-field has-clear">
        <span class="drop-label">画面定義JSON</span>
        <span class="combo-input-wrap">
          <input id="defNameInput" name="frb_def_combo_009" list="defNameList" placeholder="defs から検索・選択" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="latin" enterkeyhint="search" data-studio-ime-policy="latin-filename" style="ime-mode: inactive;" />
          <button id="openDefFolderBtn" class="combo-folder-button" type="button" aria-label="画面定義JSONの場所をExplorerで開く" title="画面定義JSONの場所をExplorerで開く" disabled>📁</button>
          <button id="clearDefNameBtn" class="combo-clear-button" type="button" aria-label="画面定義JSONの選択をクリア" title="画面定義JSONの選択をクリア">×</button>
        </span>
        <datalist id="defNameList"></datalist>
      </label>
      <label class="combo-field has-clear">
        <span class="drop-label">対象JSON</span>
        <span class="combo-input-wrap">
          <input id="dataNameInput" name="frb_data_combo_009" list="dataNameList" placeholder="data から検索・選択" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="latin" enterkeyhint="search" data-studio-ime-policy="latin-filename" style="ime-mode: inactive;" />
          <button id="openDataFolderBtn" class="combo-folder-button" type="button" aria-label="対象JSONの場所をExplorerで開く" title="対象JSONの場所をExplorerで開く" disabled>📁</button>
          <button id="clearDataNameBtn" class="combo-clear-button" type="button" aria-label="対象JSONの選択をクリア" title="対象JSONの選択をクリア">×</button>
        </span>
        <datalist id="dataNameList"></datalist>
      </label>
      <label class="drop-file-box compact-drop" data-input="defFile">
        <span class="drop-label">定義Drop</span>
        <span class="drop-name" id="defFileName">Drop</span>
        <input id="defFile" type="file" accept=".json,application/json" />
      </label>
      <label class="drop-file-box compact-drop" data-input="dataFile">
        <span class="drop-label">対象Drop</span>
        <span class="drop-name" id="dataFileName">Drop</span>
        <input id="dataFile" type="file" accept=".json,application/json" />
      </label>
      <button id="loadBtn" class="primary-button">読み込み</button>
      <button id="saveBtn" class="ghost-button" disabled>保存</button>
      <div class="studio-tool-dock studio-viewer-dock" aria-label="Viewerリンク">
        <div class="studio-tool-group" aria-label="Viewerリンク">
          <span class="studio-tool-label">Viewer</span>
          <a class="studio-nav-link markdown-link" href="mdViewer.html" title="Markdown Viewer / Editor を開く">
            <span class="nav-icon">📝</span>
            <span><span class="nav-main">Markdown</span><span class="nav-sub">Viewer</span></span>
          </a>
          <a class="studio-nav-link diff-link" href="DiffJsonViewer.html" title="DiffJson Viewer を開く">
            <span class="nav-icon">Δ</span>
            <span><span class="nav-main">DiffJSON</span><span class="nav-sub">差分Viewer</span></span>
          </a>
          <a class="studio-nav-link metadiff-link" href="MetaDiff_HypothesisViewer.html" title="MetaDiff Hypothesis Viewer を開く">
            <span class="nav-icon">🧠</span>
            <span><span class="nav-main">MetaDiff</span><span class="nav-sub">AI差分仮説</span></span>
          </a>
        </div>
      </div>
      <span class="studio-row-break" aria-hidden="true"></span>
      <div class="studio-tool-dock studio-output-dock" aria-label="Markdown出力">
        <div class="studio-tool-group" aria-label="Markdown出力">
          <span class="studio-tool-label">Output</span>
          <div class="markdown-export-control" aria-label="Markdown出力モード">
            <button id="exportMarkdownBtn" class="ghost-button studio-mini-button" disabled title="選択したモードでMarkdownを出力してViewerで開く">
              <span class="tool-main">MD</span>
              <span class="tool-sub">出力→Viewer</span>
            </button>
            <select id="exportMarkdownModeSelect" class="markdown-export-mode-select" disabled title="Markdown出力モード">
              <option value="review_report">レビュー用</option>
              <option value="full_dump">全項目</option>
            </select>
          </div>
          <button id="exportViewDefMarkdownBtn" class="ghost-button studio-mini-button" disabled title="ViewDef Markdownを出力してViewerで開く">
            <span class="tool-main">ViewDef</span>
            <span class="tool-sub">出力→Viewer</span>
          </button>
        </div>
      </div>
    </section>
    <div class="current-data-layer" aria-label="現在表示中のData JSON">
      <div id="currentDataTitle" class="current-data-title" title=""></div>
      <div id="currentDataSubtitle" class="current-data-subtitle" title=""></div>
      <span id="status" class="status current-data-path">未読み込み</span>
    </div>
  </header>

  <main>
    <section id="headerSection" class="card hidden">
      <h2 id="headerCaption">Header</h2>
      <div id="headerForm" class="form-grid"></div>
    </section>

    <section id="searchSection" class="card hidden" aria-label="検索">
      <div class="section-title-row studio-search-title-row">
        <label class="studio-full-text-search-control" for="studioFullTextSearchInput">
          <span class="studio-full-text-search-label">🔍 全文検索</span>
          <input
            id="studioFullTextSearchInput"
            type="text"
            data-field="__studio_full_text__"
            data-type="text"
            autocomplete="off"
            placeholder="サブGrid・詳細を含むJSON全体から検索"
          />
        </label>
        <div class="button-row compact">
          <button id="searchBtn" class="primary-button small">検索</button>
          <button id="clearSearchBtn" class="ghost-button small">取消</button>
        </div>
      </div>
      <div id="searchForm" class="form-grid search-grid"></div>
    </section>

    <section id="gridSection" class="card hidden grid-card">
      <div class="grid-title-row">
        <h2 id="gridCaption">Grid</h2>
        <div class="grid-actions">
          <span id="gridCount" class="count"></span>
          <button id="addRowBtn" class="primary-button small" disabled>新規</button>
          <button id="deleteRowBtn" class="ghost-button small danger" disabled>削除</button>
          <button id="gridCsvExportBtn" class="ghost-button small" disabled title="現在Gridに表示されている行・列をCSV出力">CSV出力</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="dataGrid"></table>
      </div>
    </section>
  </main>

  <dialog id="detailDialog">
    <form method="dialog" class="dialog-body">
      <div class="dialog-title-row">
        <div>
          <div class="app-kicker dark">Row Detail</div>
          <h2>詳細</h2>
        </div>
        <div class="detail-dialog-window-actions" aria-label="詳細画面のウィンドウ操作">
          <button
            id="detailDialogSizeToggleBtn"
            type="button"
            class="icon-button detail-dialog-size-toggle"
            aria-label="詳細画面を最大化"
            aria-pressed="false"
            title="詳細画面を最大化"
          ><span class="detail-window-icon" aria-hidden="true"></span></button>
          <button value="cancel" class="icon-button" aria-label="閉じる">×</button>
        </div>
      </div>
      <div id="detailForm" class="form-grid detail-grid"></div>
      <div id="detailComponentBodyArea" class="editor-component-slot" data-editor-component-slot="detailBody"></div>
      <div id="childArea"></div>
      <div id="detailComponentAfterChildArea" class="editor-component-slot" data-editor-component-slot="afterChildGrids"></div>
      <div id="detailComponentFooterArea" class="editor-component-slot" data-editor-component-slot="detailFooter"></div>
      <div class="button-row detail-footer">
        <div class="detail-roundtrip-actions" aria-label="Studio JSON Round Trip">
          <button id="copyDetailJsonBtn" type="button" class="ghost-button studio-json-roundtrip-button" title="現在の詳細画面をRow JSONとしてコピー（サブグリッド含む）">CopyJSON</button>
          <button id="pasteDetailJsonBtn" type="button" class="ghost-button studio-json-roundtrip-button" title="Row JSONを詳細画面へ展開（サブグリッド含む・F12で反映）">PasteJSON</button>
          <span id="studioJsonRoundTripDiff" class="studio-json-roundtrip-diff hidden" aria-live="polite"></span>
        </div>
        <div class="detail-navigation-actions">
          <button id="prevDetailBtn" type="button" class="ghost-button" title="F7">前へ(F7)</button>
          <button id="nextDetailBtn" type="button" class="ghost-button" title="F8">次へ(F8)</button>
          <button id="applyDetailBtn" class="primary-button" value="default" title="F12">反映(F12)</button>
          <button class="ghost-button" value="cancel">閉じる</button>
        </div>
      </div>
    </form>
  </dialog>

  <div id="rowContextMenu" class="context-menu hidden"></div>
