<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FRB Studio - JSON Object Studio v0.4-r001</title>
  <link rel="stylesheet" href="styles.css?v=markdown-preview-010" />
<!--shinobi1--><script type="text/javascript" src="//xa.shinobi.jp/ufo/192297900"></script><noscript><a href="//xa.shinobi.jp/bin/gg?192297900" target="_blank"><img src="//xa.shinobi.jp/bin/ll?192297900" border="0"></a><br><span style="font-size:9px"><img style="margin:0;vertical-align:text-bottom;" src="//img.shinobi.jp/tadaima/fj.gif" width="19" height="11"> </span></noscript><!--shinobi2-->

  <style>
    /* Markdown Viewer / Editor への導線ボタン */
    .studio-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid rgba(255, 255, 255, 0.36);
      border-radius: 16px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.02em;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.32), transparent 28%),
        linear-gradient(135deg, #22c55e 0%, #14b8a6 45%, #2563eb 100%);
      box-shadow:
        0 10px 24px rgba(20, 184, 166, 0.26),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      white-space: nowrap;
    }
    .studio-nav-link:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow:
        0 14px 30px rgba(37, 99, 235, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.40);
    }
    .studio-nav-link:active {
      transform: translateY(1px);
    }
    .studio-nav-link .nav-icon {
      width: 24px;
      height: 24px;
      display: inline-grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255,255,255,0.20);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28);
      font-size: 14px;
    }
    .studio-nav-link .nav-sub {
      display: block;
      margin-top: -2px;
      font-size: 10px;
      font-weight: 800;
      opacity: 0.78;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <header class="app-header" id="appHeader">
    <div class="brand-block">
      <div class="app-kicker" id="appBrand">FRB Studio</div>
      <h1><span id="appProductName" class="app-product-name">JSON Object Studio</span><span id="appDisplayVersion" class="app-version">v0.4-r001</span></h1>
      <p id="appTagline">JSONで思考を構造化し、AIとの文脈を育てる。</p>
    </div>

    <section class="loader-panel" aria-label="JSON読み込み">
      <label class="combo-field has-clear">
        <span class="drop-label">画面定義JSON</span>
        <span class="combo-input-wrap">
          <input id="defNameInput" name="frb_def_combo_009" list="defNameList" placeholder="defs から検索・選択" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
          <button id="clearDefNameBtn" class="combo-clear-button" type="button" aria-label="画面定義JSONの選択をクリア" title="画面定義JSONの選択をクリア">×</button>
        </span>
        <datalist id="defNameList"></datalist>
      </label>
      <label class="combo-field has-clear">
        <span class="drop-label">対象JSON</span>
        <span class="combo-input-wrap">
          <input id="dataNameInput" name="frb_data_combo_009" list="dataNameList" placeholder="data から検索・選択" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
          <button id="clearDataNameBtn" class="combo-clear-button" type="button" aria-label="対象JSONの選択をクリア" title="対象JSONの選択をクリア">×</button>
        </span>
        <datalist id="dataNameList"></datalist>
      </label>
      <label class="drop-file-box compact-drop" data-input="defFile">
        <span class="drop-label">定義Drop</span>
        <span class="drop-name" id="defFileName">Drop</span>
        <input id="defFile" type="file" accept=".json,application/json" />
      </label>
      <label class="drop-file-box compact-drop" data-input="dataFile">
        <span class="drop-label">対象Drop</span>
        <span class="drop-name" id="dataFileName">Drop</span>
        <input id="dataFile" type="file" accept=".json,application/json" />
      </label>
      <button id="loadBtn" class="primary-button">読み込み</button>
      <button id="saveBtn" class="ghost-button" disabled>保存</button>
      <button id="exportMarkdownBtn" class="ghost-button" disabled>Markdown出力→Viewer</button>
      <button id="exportViewDefMarkdownBtn" class="ghost-button" disabled>ViewDef Markdown→Viewer</button>
      <a class="studio-nav-link" href="mdViewer.html" title="Markdown Viewer / Editor を開く">
        <span class="nav-icon">📝</span>
        <span>Markdown<span class="nav-sub">Viewer / Editor</span></span>
      </a>
      <span id="status" class="status">未読み込み</span>
    </section>
  </header>

  <main>
    <section id="headerSection" class="card hidden">
      <h2 id="headerCaption">Header</h2>
      <div id="headerForm" class="form-grid"></div>
    </section>

    <section id="searchSection" class="card hidden">
      <div class="section-title-row">
        <h2>検索</h2>
        <div class="button-row compact">
          <button id="searchBtn" class="primary-button small">検索</button>
          <button id="clearSearchBtn" class="ghost-button small">取消</button>
        </div>
      </div>
      <div id="searchForm" class="form-grid search-grid"></div>
    </section>

    <section id="gridSection" class="card hidden grid-card">
      <div class="grid-title-row">
        <h2 id="gridCaption">Grid</h2>
        <div class="grid-actions">
          <span id="gridCount" class="count"></span>
          <button id="addRowBtn" class="primary-button small" disabled>新規</button>
          <button id="deleteRowBtn" class="ghost-button small danger" disabled>削除</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="dataGrid"></table>
      </div>
    </section>
  </main>

  <dialog id="detailDialog">
    <form method="dialog" class="dialog-body">
      <div class="dialog-title-row">
        <div>
          <div class="app-kicker dark">Row Detail</div>
          <h2>詳細</h2>
        </div>
        <button value="cancel" class="icon-button" aria-label="閉じる">×</button>
      </div>
      <div id="detailForm" class="form-grid detail-grid"></div>
      <div id="childArea"></div>
      <div class="button-row right detail-footer">
        <button id="prevDetailBtn" type="button" class="ghost-button" title="F7">前へ(F7)</button>
        <button id="nextDetailBtn" type="button" class="ghost-button" title="F8">次へ(F8)</button>
        <button id="applyDetailBtn" class="primary-button" value="default" title="F12">反映(F12)</button>
        <button class="ghost-button" value="cancel">閉じる</button>
      </div>
    </form>
  </dialog>

  <div id="rowContextMenu" class="context-menu hidden"></div>
  <script src="js/core/state.js?v=url-launch-008"></script>
  <script src="js/core/registry.js?v=action-execute-006"></script>
  <script src="js/core/file_api.js?v=action-execute-006"></script>
  <script src="js/core/field_types.js?v=action-execute-006"></script>
  <script src="js/core/viewdef_resolver.js?v=action-execute-006"></script>
  <script src="js/core/loaders.js?v=action-execute-006"></script>
  <script src="js/ui/page_setup.js?v=json-object-studio-009"></script>
  <script src="js/ui/file_tree_picker.js?v=folder-tree-010"></script>
  <script src="js/core/data_utils.js?v=action-execute-006"></script>
  <script src="js/renderers/renderer_registry.js?v=action-execute-006"></script>
  <script src="js/renderers/field_control_registry.js?v=action-execute-006"></script>
  <script src="js/virtualData/virtual_data_registry.js?v=action-execute-006"></script>
  <script src="js/virtualData/relation_builders.js?v=action-execute-006"></script>
  <script src="js/virtualData/expected_builders.js?v=action-execute-006"></script>
  <script src="js/renderers/field_controls.js?v=markdown-preview-010"></script>
  <script src="js/renderers/grid_detail.js?v=action-execute-006"></script>
  <script src="js/markdown/markdown_registry.js?v=action-execute-006"></script>
  <script src="js/markdown/data_markdown.js?v=json-object-studio-009"></script>
  <script src="js/markdown/viewdef_markdown.js?v=action-execute-006"></script>
  <script src="js/runtime/detail_save.js?v=action-execute-006"></script>
  <script src="js/runtime/load_runtime.js?v=url-launch-008"></script>
  <script src="js/actions/action_registry.js?v=action-execute-006"></script>
  <script src="js/actions/action_toolbar.js?v=action-execute-006"></script>
  <script src="app.js?v=json-object-studio-009"></script>
</body>
</html>
