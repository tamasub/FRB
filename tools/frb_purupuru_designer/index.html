<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRB Artificial PuruPuru Designer v2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">FRB Phase 2.5</p>
        <h1>Artificial PuruPuru Designer v2</h1>
        <p class="lead">バネの超絶特上ぷるぷる感を狙って、短時間・急加速・尾っぽ高速振動を設計する実験UI。</p>
      </div>
      <div class="transport">
        <button id="playBtn">Play</button>
        <button id="stopBtn" class="ghost">Stop</button>
      </div>
    </header>

    <section class="panel">
      <div class="chartHead">
        <div>
          <h2>Wave Preview</h2>
          <p id="formulaText">y(t) = A・e^(-λt)・sin(phase)</p>
        </div>
        <div class="readout">
          <span id="timeReadout">10.0s</span>
          <span id="freqReadout">20.0Hz → 150.0Hz</span>
        </div>
      </div>
      <canvas id="waveCanvas"></canvas>
    </section>

    <section class="grid">
      <section class="panel controls">
        <h2>主ぷる</h2>

        <label>
          <span>全体秒数</span>
          <input id="duration" type="range" min="0.5" max="20" step="0.1" value="10">
          <output id="durationOut"></output>
        </label>

        <label>
          <span>初期振幅 A</span>
          <input id="amp" type="range" min="0" max="1" step="0.01" value="0.85">
          <output id="ampOut"></output>
        </label>

        <label>
          <span>減衰 λ</span>
          <input id="decay" type="range" min="0" max="1.2" step="0.01" value="0.22">
          <output id="decayOut"></output>
        </label>

        <label>
          <span>開始Hz f0</span>
          <input id="f0" type="range" min="5" max="220" step="1" value="20">
          <output id="f0Out"></output>
        </label>

        <label>
          <span>終了Hz f1</span>
          <input id="f1" type="range" min="5" max="500" step="1" value="150">
          <output id="f1Out"></output>
        </label>

        <label>
          <span>細密化カーブ</span>
          <input id="curve" type="range" min="0.2" max="4" step="0.05" value="1.7">
          <output id="curveOut"></output>
        </label>

        <label>
          <span>スピード倍率</span>
          <input id="speedBoost" type="range" min="0.25" max="6" step="0.05" value="1.00">
          <output id="speedBoostOut"></output>
        </label>

        <label>
          <span>急加速</span>
          <input id="accel" type="range" min="0" max="1" step="0.01" value="0.45">
          <output id="accelOut"></output>
        </label>

        <label>
          <span>尾っぽ高速</span>
          <input id="tailSpeed" type="range" min="0" max="1" step="0.01" value="0.35">
          <output id="tailSpeedOut"></output>
        </label>

        <label>
          <span>AMうねりHz</span>
          <input id="modFreq" type="range" min="0.1" max="20" step="0.1" value="5">
          <output id="modFreqOut"></output>
        </label>

        <label>
          <span>AM深さ</span>
          <input id="modDepth" type="range" min="0" max="1" step="0.01" value="0.5">
          <output id="modDepthOut"></output>
        </label>

        <label>
          <span>ズレHz差</span>
          <input id="detuneHz" type="range" min="0" max="30" step="0.1" value="3">
          <output id="detuneHzOut"></output>
        </label>

        <label>
          <span>ズレ強度</span>
          <input id="detuneMix" type="range" min="0" max="1" step="0.01" value="0.35">
          <output id="detuneMixOut"></output>
        </label>

        <label>
          <span>ズレ位相</span>
          <input id="detunePhase" type="range" min="0" max="360" step="1" value="0">
          <output id="detunePhaseOut"></output>
        </label>
      </section>

      <section class="panel controls">
        <h2>生っぽさ</h2>

        <label>
          <span>第2波 強度</span>
          <input id="secondAmp" type="range" min="0" max="0.8" step="0.01" value="0.18">
          <output id="secondAmpOut"></output>
        </label>

        <label>
          <span>第2波 位置</span>
          <input id="secondPos" type="range" min="0.05" max="0.95" step="0.01" value="0.42">
          <output id="secondPosOut"></output>
        </label>

        <label>
          <span>微細ゆらぎ</span>
          <input id="jitter" type="range" min="0" max="0.35" step="0.01" value="0.06">
          <output id="jitterOut"></output>
        </label>

        <label>
          <span>音量</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.35">
          <output id="volumeOut"></output>
        </label>

        <div class="presets">
          <button data-preset="soft">やわらか尾っぽ</button>
          <button data-preset="tokujou">特上ぷるぷる</button>
          <button data-preset="sharp">短めアタリ</button>
          <button data-preset="spring">バネ特上</button>
        </div>
      </section>
    </section>

    <footer>
      <p>v2.1: AMうねり + ズレ和音構造を追加。WAV保存なし。</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
