<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRB Markdown Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <style>
    :root{--bg:#f6f8fc;--bg2:#eef4ff;--panel:rgba(255,255,255,.86);--text:#172033;--muted:#68738a;--line:rgba(101,119,155,.18);--blue:#3f7cff;--violet:#8c6ff7;--green:#16b981;--orange:#f59e0b;--red:#ef4444;--shadow:0 20px 60px rgba(33,56,107,.12);--radius:22px;--code-bg:#0f172a;--code-text:#dbeafe}[data-theme="dark"]{--bg:#0b1020;--bg2:#111a33;--panel:rgba(17,24,39,.78);--text:#eaf0ff;--muted:#9aa7bd;--line:rgba(226,232,240,.12);--shadow:0 24px 70px rgba(0,0,0,.34);--code-bg:#020617;--code-text:#dbeafe}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:radial-gradient(circle at 12% 8%,rgba(117,158,255,.28),transparent 28%),radial-gradient(circle at 88% 4%,rgba(184,137,255,.24),transparent 26%),linear-gradient(135deg,var(--bg),var(--bg2));font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.82;min-height:100vh}.app{width:min(1240px,calc(100% - 28px));margin:16px auto 56px}.topbar{position:sticky;top:12px;z-index:20;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:24px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,rgba(63,124,255,.18),rgba(140,111,247,.18));font-size:22px}.brand h1{margin:0;font-size:21px}.badge{padding:4px 10px;border-radius:999px;background:rgba(63,124,255,.12);color:var(--blue);font-size:12px;font-weight:700}.controls{display:grid;grid-template-columns:1fr auto;gap:10px;min-width:0}.urlbox label{display:block;margin-bottom:3px;color:var(--muted);font-size:12px;font-weight:700}input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.72);color:var(--text);font-size:14px;outline:none}input:focus{border-color:rgba(63,124,255,.56);box-shadow:0 0 0 4px rgba(63,124,255,.11)}button{align-self:end;padding:12px 18px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--violet));color:white;font-weight:800;cursor:pointer;box-shadow:0 12px 28px rgba(63,124,255,.26)}.ghost-btn{background:rgba(105,120,160,.12);color:var(--text);box-shadow:none}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}.sidebar{position:sticky;top:104px;display:grid;gap:16px}.side-card,.article-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow)}.side-card{padding:18px}.side-card h2{margin:0 0 14px;font-size:17px}.toc{display:grid;gap:2px;max-height:52vh;overflow:auto;padding-right:4px}.toc a{display:block;padding:8px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px;line-height:1.45}.toc a:hover{background:rgba(63,124,255,.1);color:var(--blue)}.toc .level-2{padding-left:18px}.toc .level-3{padding-left:30px;font-size:12px}.meta-list{display:grid;gap:12px;color:var(--muted);font-size:13px}.meta-list b{display:block;color:var(--text);margin-bottom:2px}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;color:var(--muted);font-size:13px}.switch{position:relative;width:48px;height:28px;border-radius:999px;background:rgba(100,116,139,.32);cursor:pointer}.switch:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:white;box-shadow:0 4px 10px rgba(0,0,0,.16);transition:.18s}[data-theme="dark"] .switch:after{transform:translateX(20px)}.article-card{padding:clamp(22px,4vw,42px);overflow:hidden}.status{padding:18px;border-radius:16px;background:rgba(63,124,255,.10);color:var(--muted)}.markdown-body{font-size:16px}.markdown-body h1,.markdown-body h2,.markdown-body h3{color:var(--text);line-height:1.35}.markdown-body h1{margin:0 0 22px;font-size:clamp(30px,4vw,44px);letter-spacing:-.03em}.markdown-body h2{margin:48px 0 18px;padding-bottom:10px;border-bottom:2px solid rgba(63,124,255,.35);font-size:clamp(24px,3vw,32px)}.markdown-body h2:first-letter{color:var(--blue)}.markdown-body h3{margin:34px 0 14px;font-size:22px}.markdown-body a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(63,124,255,.28)}.markdown-body hr{border:0;height:1px;margin:34px 0;background:linear-gradient(90deg,transparent,rgba(63,124,255,.30),transparent)}.markdown-body blockquote{margin:22px 0;padding:18px 20px;border-left:5px solid var(--blue);border-radius:16px;background:linear-gradient(135deg,rgba(63,124,255,.09),rgba(140,111,247,.07))}.markdown-body code:not(pre code){padding:2px 7px;border-radius:8px;background:rgba(63,124,255,.12);color:var(--blue);font-size:.92em}.markdown-body pre{margin:22px 0;padding:18px;border-radius:18px;background:var(--code-bg);color:var(--code-text);overflow-x:auto}.markdown-body img{max-width:100%;height:auto;border-radius:18px;box-shadow:0 18px 46px rgba(20,32,70,.14)}.markdown-body table{width:100%;border-collapse:separate;border-spacing:0;margin:22px 0;border:1px solid var(--line);border-radius:16px;display:block;overflow-x:auto}.markdown-body th,.markdown-body td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}.markdown-body th{background:rgba(63,124,255,.10);font-weight:850}.qiita-note{position:relative;margin:24px 0;padding:18px 20px 18px 58px;border-radius:18px;border:1px solid var(--line);overflow:hidden;box-shadow:0 14px 34px rgba(33,56,107,.08)}.qiita-note:before{position:absolute;left:20px;top:18px;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;font-weight:900;font-size:14px}.qiita-note.info{background:linear-gradient(135deg,rgba(91,127,255,.14),rgba(173,126,255,.15));border-left:5px solid var(--violet)}.qiita-note.info:before{content:"i";color:var(--violet);background:rgba(140,111,247,.14)}.qiita-note.warn{background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(255,255,255,.08));border-left:5px solid var(--orange)}.qiita-note.warn:before{content:"!";color:var(--orange);background:rgba(245,158,11,.16)}.qiita-note.alert{background:linear-gradient(135deg,rgba(239,68,68,.13),rgba(255,255,255,.08));border-left:5px solid var(--red)}.qiita-note.alert:before{content:"!";color:var(--red);background:rgba(239,68,68,.15)}.qiita-note.success{background:linear-gradient(135deg,rgba(22,185,129,.13),rgba(255,255,255,.08));border-left:5px solid var(--green)}.qiita-note.success:before{content:"✓";color:var(--green);background:rgba(22,185,129,.15)}.article-hero{margin-bottom:26px;padding:18px 20px;border-radius:18px;background:linear-gradient(135deg,rgba(63,124,255,.12),rgba(140,111,247,.10));color:var(--muted)}.article-hero b{color:var(--text)}.footer-note{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:880px){.topbar{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.sidebar{position:static;order:2}.article-card{order:1}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="logo">🎣</div><h1>FRB Viewer</h1><span class="badge">Markdown Viewer</span></div>
      <div class="controls"><div class="urlbox"><label for="mdUrl">Markdown URL</label><input id="mdUrl" type="text" value="https://raw.githubusercontent.com/tamasub/FRB/main/FRB_Blog/FRB_Lab_Notes_Qiita.md" /></div><button id="loadBtn">読み込む</button></div>
      <button class="ghost-btn" id="copyLinkBtn">共有URL</button>
    </header>
    <main class="layout">
      <aside class="sidebar"><section class="side-card"><h2>目次</h2><nav id="toc" class="toc"><span style="color:var(--muted);font-size:13px;">読み込み後に生成されます</span></nav></section><section class="side-card"><h2>この記事について</h2><div class="meta-list"><div><b>ソース</b><a id="sourceLink" href="#" target="_blank" rel="noreferrer">GitHub Raw</a></div><div><b>文字数</b><span id="charCount">-</span></div><div><b>読了目安</b><span id="readTime">-</span></div></div></section><section class="side-card"><div class="switch-row"><div><b style="color:var(--text);">ダークモード</b><br>目に優しいテーマ</div><div id="themeSwitch" class="switch" role="switch" aria-label="toggle dark mode"></div></div></section></aside>
      <article class="article-card"><div class="article-hero"><b>FRB Markdown Viewer</b><br>GitHub Raw の Markdown を読み込み、Qiita風の note 記法も見やすく表示します。</div><div id="preview" class="markdown-body"><div class="status">Loading...</div></div><div class="footer-note">FRB Viewer / Markdown rendered by marked.js</div></article>
    </main>
  </div>
<script>
const DEFAULT_MD="https://raw.githubusercontent.com/tamasub/FRB/main/FRB_Blog/FRB_Lab_Notes_Qiita.md";
const mdUrlEl=document.getElementById("mdUrl"),previewEl=document.getElementById("preview"),tocEl=document.getElementById("toc"),sourceLinkEl=document.getElementById("sourceLink"),charCountEl=document.getElementById("charCount"),readTimeEl=document.getElementById("readTime");
marked.setOptions({gfm:true,breaks:true,headerIds:false,mangle:false});
function safeDecode(v){try{return decodeURIComponent(v)}catch(e){return v}}
function getInitialUrl(){const params=new URLSearchParams(location.search);return params.get("md")||DEFAULT_MD}
function fixHashInGithubRawUrl(url){url=(url||"").trim(); if(!url.includes("raw.githubusercontent.com")) return url; if(url.includes("#") && !url.includes("%23")) return url.replace(/#/g,"%23"); return url}
function encodeRawGithubPath(url){try{const u=new URL(url); if(u.hostname!=="raw.githubusercontent.com") return url; u.pathname=u.pathname.split("/").map((seg,i)=>i===0?seg:encodeURIComponent(decodeURIComponent(seg))).join("/"); return u.toString()}catch(e){return url}}
function normalizeMarkdownUrl(input){let url=safeDecode(input.trim()); url=githubBlobToRaw(url); url=fixHashInGithubRawUrl(url); url=encodeRawGithubPath(url); return url}
function githubBlobToRaw(url){try{const u=new URL(url);if(u.hostname==="github.com"&&u.pathname.includes("/blob/")){const parts=u.pathname.split("/").filter(Boolean);return `https://raw.githubusercontent.com/${parts[0]}/${parts[1]}/${parts[3]}/${parts.slice(4).join("/")}`}}catch(e){}return url}
function preprocessQiita(md){return md.replace(/:::note\s*(info|warn|alert|success)?\s*\n([\s\S]*?)\n:::/g,(_,type,body)=>`<div class="qiita-note ${type||"info"}">\n\n${body.trim()}\n\n</div>`)}
function slugify(text,index){return"sec-"+index+"-"+encodeURIComponent(text.trim().toLowerCase()).replace(/%/g,"")}
function buildToc(){const headings=previewEl.querySelectorAll("h1,h2,h3");tocEl.innerHTML="";if(!headings.length){tocEl.innerHTML='<span style="color:var(--muted);font-size:13px;">見出しがありません</span>';return}headings.forEach((h,i)=>{const id=slugify(h.textContent,i);h.id=id;const a=document.createElement("a");a.href="#"+id;a.textContent=h.textContent;a.className="level-"+h.tagName.substring(1);tocEl.appendChild(a)})}
function updateMeta(md,url){const chars=md.replace(/\s/g,"").length;charCountEl.textContent=chars.toLocaleString("ja-JP")+" 文字";readTimeEl.textContent="約 "+Math.max(1,Math.ceil(chars/800))+" 分";sourceLinkEl.href=url}
async function loadMarkdown(rawUrl){const url=normalizeMarkdownUrl(rawUrl);mdUrlEl.value=url;sourceLinkEl.href=url;previewEl.innerHTML='<div class="status">Markdownを読み込み中...</div>';tocEl.innerHTML='<span style="color:var(--muted);font-size:13px;">読み込み中...</span>';try{const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw new Error(`HTTP ${res.status}`);const md=await res.text();const html=marked.parse(preprocessQiita(md));previewEl.innerHTML=DOMPurify.sanitize(html,{ADD_ATTR:["target"]});previewEl.querySelectorAll('a[href^="http"]').forEach(a=>{a.target="_blank";a.rel="noreferrer"});buildToc();updateMeta(md,url);const params=new URLSearchParams(location.search);params.set("md",url);history.replaceState(null,"",location.pathname+"?"+params.toString())}catch(err){previewEl.innerHTML=`<div class="qiita-note alert"><strong>読み込みエラー</strong><br>Markdownを読み込めませんでした。<br><code>${String(err.message||err)}</code><br><br>ファイル名に # がある場合は自動で %23 に変換します。GitHubの通常URLでもRaw URLへ変換します。</div>`;tocEl.innerHTML='<span style="color:var(--muted);font-size:13px;">読み込み失敗</span>'}}
document.getElementById("loadBtn").addEventListener("click",()=>loadMarkdown(mdUrlEl.value));mdUrlEl.addEventListener("keydown",e=>{if(e.key==="Enter")loadMarkdown(mdUrlEl.value)});document.getElementById("copyLinkBtn").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById("copyLinkBtn").textContent="コピー済";setTimeout(()=>document.getElementById("copyLinkBtn").textContent="共有URL",1200)}catch(e){alert(location.href)}});document.getElementById("themeSwitch").addEventListener("click",()=>{const next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);localStorage.setItem("frb-md-theme",next)});if(localStorage.getItem("frb-md-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");mdUrlEl.value=getInitialUrl();loadMarkdown(mdUrlEl.value);
</script>
</body>
</html>
